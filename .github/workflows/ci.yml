name: CI

# Three suites pass today and nothing enforced it. This does.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The repo is analyzer-clean; anything less fails the build rather than
      # accumulating into a warning list nobody reads.
      - run: flutter analyze --fatal-infos

      - run: flutter test

  android:
    name: Android — release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # No key.properties here, so this exercises the debug-signing fallback.
      # Its job is to catch a Gradle or manifest change that breaks the build —
      # the artifact is not publishable and is not kept.
      - run: flutter build apk --release --dart-define=FOOD_API_BASE_URL=https://example.invalid

  microservice:
    name: Microservice — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: microservice/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest -q

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test_rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Firestore emulator needs JDK 21 or newer; firebase-tools refuses
      # anything older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund --no-save firebase-tools
      - run: npx --no-install firebase emulators:exec --only firestore --project demo-void-factor "node --test rules.test.mjs"
