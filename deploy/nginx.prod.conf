# Production nginx: TLS termination plus the same rate limiting as development.
#
# The server blocks live in templates/app.conf.template rather than here because
# they name the hostname, and nginx:alpine's entrypoint runs envsubst over
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/ at start. That is what
# lets one image serve an sslip.io name today and a real domain later with no
# rebuild.

worker_processes auto;

# A proxied request holds two connections, one to the client and one to the
# replica, so worker_processes x worker_connections is twice the in-flight
# ceiling rather than equal to it. At 1024 on a four-core host that ceiling was
# about 2,000, and a load test driven past it did not slow down — it collapsed,
# logging "1024 worker_connections are not enough" 37,500 times in one run while
# throughput fell. 4096 puts the proxy's ceiling above the service's own, which
# is where it belongs: the thing that runs out first should be the thing doing
# the work.
#
# 8192 since the rate limit moved behind a loopback hop (nginx/api_http.conf):
# an /api/ request now holds four connections in nginx rather than two — client
# and loopback on the public side, loopback and replica on the limiter's — so
# the same in-flight ceiling needs twice the connections. Raising it further
# would only move the failure downstream, since the service itself breaks up
# around 6,000 requests in flight.
#
# worker_connections is capped by the per-worker file descriptor limit, so that
# is raised to match; without it nginx accepts the setting and then fails on
# accept() instead.
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    # Rate-limit zones and the loopback limiter. The same file development
    # includes, so the two cannot drift.
    include /etc/nginx/api_http.conf;

    # Two replicas, round-robined by least connections rather than strict
    # round-robin: a provider call runs for seconds and the spread is wide, so
    # picking the idler backend matters more here than picking the next one.
    #
    # max_fails/fail_timeout eject a replica that is refusing connections and
    # retry it ten seconds later. The window is deliberately not tighter than
    # that: under load both replicas are slow, and a short window would eject
    # both and take the service down on its own.
    #
    # A POST is not replayed onto the surviving replica after it has been sent
    # (nginx's default), because the request may already have reached the
    # provider and spent the caller's quota. Connection-time failures, where
    # nothing was sent, still fail over.
    upstream microservice {
        least_conn;
        server microservice-1:8000 max_fails=3 fail_timeout=10s;
        server microservice-2:8000 max_fails=3 fail_timeout=10s;

        # Idle connections held open per worker, so a request does not pay for
        # a fresh TCP handshake to the replica it lands on. Raised with
        # worker_connections above: at four workers this caches 512 idle
        # upstream sockets, which is the churn a four-figure request rate would
        # otherwise generate.
        keepalive 128;
    }

    include /etc/nginx/conf.d/*.conf;
}
