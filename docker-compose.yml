services:
  microservice:
    build: ./microservice
    env_file:
      - path: ./microservice/.env
        required: false
    environment:
      # Without this the /api/ routes fail closed, so local scanning would 503.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-signinpractice-bfade}
    expose:
      - "8000"
    networks:
      - internal
    # nginx is configured for 4096 connections per worker and the service holds
    # a socket per request in flight. The engine's default of 1024 open files
    # would cap both well below that, and the symptom is an accept() failure
    # rather than anything naming the limit.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api_locations.conf:/etc/nginx/api_locations.conf:ro
      - ./nginx/api_http.conf:/etc/nginx/api_http.conf:ro
    depends_on:
      microservice:
        condition: service_healthy
    networks:
      - internal
    # nginx is configured for 4096 connections per worker and the service holds
    # a socket per request in flight. The engine's default of 1024 open files
    # would cap both well below that, and the symptom is an accept() failure
    # rather than anything naming the limit.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

networks:
  internal:
    driver: bridge
