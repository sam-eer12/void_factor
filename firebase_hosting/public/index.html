<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolith Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #F9F9F9;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #FFFFFF;
            border: 3px solid #000000;
            box-shadow: 8px 8px 0px #000000;
            padding: 40px;
            text-align: center;
        }
        .logo-box {
            display: inline-block;
            background-color: #000000;
            color: #FFFFFF;
            font-weight: 900;
            padding: 10px 20px;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 40px;
            border: 2px solid #000000;
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .divider {
            width: 80px;
            height: 4px;
            background-color: #000000;
            margin: 0 auto 30px auto;
        }
        .status-box {
            background-color: #000000;
            color: #FFFFFF;
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .status-box svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 24px;
        }
        .button {
            display: block;
            width: 100%;
            background-color: #FFFFFF;
            color: #000000;
            border: 2px solid #000000;
            padding: 14px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }
        .button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">MONOLITH</div>
        
        <div class="status-box">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 12.5l3 3 5-6"></path>
            </svg>
            <h1>Verification Complete</h1>
        </div>
        
        <div class="divider"></div>
        
        <p>Your email authentication is successful. You can now close this tab and head back to the app to access your training node.</p>
        
        <a href="intent://#Intent;scheme=void_factor;package=com.example.firebase_prac_proj;end" class="button">Return to App</a>
    </div>
</body>
</html>
