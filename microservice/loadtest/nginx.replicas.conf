# The production upstream, over plain HTTP.
#
# deploy/nginx.prod.conf cannot be used directly for a failover test: its server
# block lives in a template that names a hostname and needs a certificate. What
# failover actually depends on is the upstream stanza, so that is reproduced
# here byte for byte — least_conn, max_fails, fail_timeout, keepalive — while the
# location rules come from the same shared api_locations.conf both deployments
# include. Routing and rate limiting therefore cannot drift from production; only
# TLS is absent, and TLS is not what decides whether a dead replica is ejected.
#
# Keep the upstream block here in step with deploy/nginx.prod.conf.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    limit_req_zone $http_x_user_id zone=peruser:10m rate=10r/m;
    limit_req_status 429;

    upstream microservice {
        least_conn;
        server microservice-1:8000 max_fails=3 fail_timeout=10s;
        server microservice-2:8000 max_fails=3 fail_timeout=10s;

        keepalive 128;
    }

    server {
        listen 80;
        default_type application/json;

        include /etc/nginx/api_locations.conf;
    }
}
