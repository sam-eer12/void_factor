# http-level half of the API edge, shared by development (nginx/nginx.conf),
# production (deploy/nginx.prod.conf) and the replica load test. The
# server-level half is api_locations.conf. Each deployment still declares its
# own `upstream microservice`, since that is the one thing that differs.
#
# ── Why the rate limit takes two hops ──
#
# The per-user limit used to key on the X-User-Id header, which nginx counted
# before anything had checked it. Two holes followed. A caller could vary the
# header and land in a fresh bucket on every request. Worse, a caller could send
# *someone else's* uid and spend that user's ten scans a minute for them —
# uids are not secret — while every one of those requests was rightly 401'd
# further in. Authorization held; the bucket did not.
#
# The limit now keys on a uid FastAPI has verified from the bearer token. That
# needs two hops because of nginx's phase order: limit_req runs in the
# preaccess phase and auth_request in the access phase after it, so within one
# location the limit is always decided before the token is known to be good.
# So the public location (api_locations.conf) verifies, then hands the request
# to the loopback server below, which limits on the uid the verification
# returned and proxies on to the service.
#
# What that costs: an extra proxy hop inside one process over loopback, and a
# second connection pair per request in flight (see worker_connections in the
# files that include this). What it buys: forged or borrowed uids never reach a
# bucket at all, and an unauthenticated request is refused before its body is
# read rather than after 12MB of it has been.

# Per verified user: ~10 requests/minute. The key is only ever set by the
# public location from the verification response; the loopback listener is
# unreachable from outside the container, so a client cannot supply it.
limit_req_zone $http_x_verified_uid zone=peruser:10m rate=10r/m;

# Per client address, before anything is verified. This is what bounds the
# work an unauthenticated caller can ask of the verifier, now that forged
# requests no longer land in anyone's bucket. Thirty times one user's allowance,
# so a household or an office behind one NAT does not notice it.
#
# Private addresses are exempt, by an empty key (nginx does not count requests
# whose key is empty). That covers the load generator and health checks inside
# the compose network, and it chooses the safe failure for one deployment
# mistake: a container engine whose port forwarding hides the client address
# makes every caller look like the bridge gateway. Limited, that would turn this
# into one global 5r/s cap for the whole service. Exempt, it degrades to no
# per-address limit, with the verified per-user limit still in force.
geo $edge_private_client {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    ::1             1;
    fc00::/7        1;
}
map $edge_private_client $edge_address_key {
    1       "";
    default $binary_remote_addr;
}
limit_req_zone $edge_address_key zone=peraddress:10m rate=5r/s;

limit_req_status 429;

upstream ratelimiter {
    server 127.0.0.1:8081;
    keepalive 64;
}

server {
    # Loopback only: nothing outside this container can reach it, which is what
    # makes X-Verified-Uid trustworthy here.
    listen 127.0.0.1:8081;
    default_type application/json;

    proxy_connect_timeout 3s;

    location /api/ {
        # Unreachable in practice — the public location always sets the header
        # or refuses the request. An empty key would be exempt from the limit,
        # though, so an empty one fails closed rather than open.
        if ($http_x_verified_uid = "") {
            return 500 '{"detail":"auth: limiter reached without a verified uid"}';
        }

        limit_req zone=peruser burst=5 nodelay;

        client_max_body_size 12m;

        proxy_pass http://microservice;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Passed through as the public hop set them, rather than rewritten with
        # this hop's view of the world, which is 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        return 404 '{"detail":"not found"}';
    }

    error_page 429 = @ratelimited;
    location @ratelimited {
        return 429 '{"error":"rate limit exceeded"}';
    }
}
