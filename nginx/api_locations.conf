# Shared by the development server block (nginx/nginx.conf) and the production
# TLS one (deploy/templates/app.conf.template).
#
# One file so the two deployments cannot drift: a rate limit that held locally
# but not in production would be discovered in production.

# Connecting to a replica is not the same as waiting for its answer, and the
# default for the former is 60s. A replica that dies with its network namespace
# torn down blackholes packets rather than refusing them, so nginx sits on the
# dead backend for a minute before trying the other one — and needs three such
# stalls before it ejects the replica at all. A container on the same host
# answers in well under a millisecond, so 3s is already pure headroom.
#
# Deliberately at server scope rather than inside location /api/: /health is
# what the uptime monitor polls, and a health endpoint that hangs for a minute
# reports the wrong thing about a service that is actually fine.
proxy_connect_timeout 3s;

# Unlimited, no user id required — this is what the container healthcheck and
# any uptime monitor hit.
location = /health {
    proxy_pass http://microservice;
}

location = / {
    proxy_pass http://microservice;
}

# Rate-limited provider endpoints.
location /api/ {
    # nginx does not count requests whose limit key is empty, so an absent
    # X-User-Id would otherwise bypass the limit entirely.
    if ($http_x_user_id = "") {
        return 400 '{"error":"X-User-Id header required"}';
    }

    limit_req zone=peruser burst=5 nodelay;

    # A phone photo arrives compressed but is still megabytes; the default 1m
    # would reject it as a 413 before FastAPI saw it.
    client_max_body_size 12m;

    proxy_pass http://microservice;

    # The upstream keepalive pool in production is only used over HTTP/1.1 with
    # the client's Connection header cleared; without both of these nginx opens
    # a fresh connection to the replica on every request and the pool sits
    # empty. A no-op in development, where the upstream declares no pool.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id $http_x_user_id;

    # The upstream allows itself 60s per provider call; the client waits 75s.
    # Anything shorter here would cut off a request that is still being served.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

# JSON body for rate-limit rejections.
error_page 429 = @ratelimited;
location @ratelimited {
    return 429 '{"error":"rate limit exceeded"}';
}
