# Shared by the development server block (nginx/nginx.conf) and the production
# TLS one (deploy/templates/app.conf.template). Needs api_http.conf included at
# http level, which holds the rate-limit zones and the loopback limiter this
# hands requests to.
#
# One file so the two deployments cannot drift: a rate limit that held locally
# but not in production would be discovered in production.

# Connecting to a replica is not the same as waiting for its answer, and the
# default for the former is 60s. A replica that dies with its network namespace
# torn down blackholes packets rather than refusing them, so nginx sits on the
# dead backend for a minute before trying the other one — and needs three such
# stalls before it ejects the replica at all. A container on the same host
# answers in well under a millisecond, so 3s is already pure headroom.
#
# Deliberately at server scope rather than inside location /api/: /health is
# what the uptime monitor polls, and a health endpoint that hangs for a minute
# reports the wrong thing about a service that is actually fine.
proxy_connect_timeout 3s;
access_log /dev/stdout vf_safe;

# Authentication occurs on the public hop; only the loopback hop applies the
# per-user limits. Model requests never spend the food-scan allowance.
location = /api/v1/models/gemma/download-link {
    limit_req zone=peraddress burst=20 nodelay;
    client_max_body_size 8k;
    auth_request /_verify;
    auth_request_set $verified_model_link_uid $upstream_http_x_verified_uid;
    error_page 401 = @unauthenticated;
    error_page 500 = @verifier_unavailable;
    error_page 429 = @model_ratelimited;
    proxy_pass http://ratelimiter;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Verified-Uid $verified_model_link_uid;
    proxy_set_header Host $host;
}

location /models/ {
    set $model_original_method $request_method;
    limit_req zone=peraddress burst=20 nodelay;
    auth_request /_verify_model;
    auth_request_set $verified_model_uid $upstream_http_x_verified_uid;
    error_page 403 = @model_forbidden;
    error_page 500 = @model_unavailable;
    error_page 429 = @model_ratelimited;

    # The verifier approved this exact path. Strip the capability query before
    # the next hop so it cannot appear in that hop's errors or logs.
    proxy_pass http://ratelimiter$uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Verified-Uid $verified_model_uid;
    proxy_set_header Authorization "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-Original-URI "";
    proxy_set_header Host $host;
    # Slow clients must keep their transfer slot, without the proxy reading a
    # whole model ahead into temporary files. Byte ranges and ETags pass through.
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    gzip off;
    proxy_read_timeout 300s;
    send_timeout 300s;
    error_log /dev/null crit;
}

location = /_verify_model {
    internal;
    proxy_pass http://microservice/internal/models/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Always overwrite these headers; caller-supplied values are untrusted.
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $model_original_method;
    proxy_set_header Authorization "";
    proxy_set_header X-Verified-Uid "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
    access_log off;
    error_log /dev/null crit;
}

location @model_forbidden {
    return 403 '{"detail":"model: invalid or expired link"}';
}
location @model_unavailable {
    return 503 '{"detail":"model: verifier unavailable"}';
}
location @model_ratelimited {
    add_header Retry-After 10 always;
    return 429 '{"detail":"model: rate limit exceeded"}';
}

# Unlimited, no user id required — this is what the container healthcheck and
# any uptime monitor hit.
location = /health {
    proxy_pass http://microservice;
}

location = / {
    proxy_pass http://microservice;
}

# Rate-limited provider endpoints. The order a request meets things in:
#
#   1. the per-address limit (preaccess phase), before anything is verified;
#   2. token verification via /_verify (access phase), before the body is read;
#   3. the per-user limit, keyed on the verified uid, in the loopback server
#      (api_http.conf), which then proxies to the service.
location /api/ {
    limit_req zone=peraddress burst=20 nodelay;

    # A phone photo arrives compressed but is still megabytes; the default 1m
    # would reject it as a 413 before FastAPI saw it.
    client_max_body_size 12m;

    auth_request /_verify;
    auth_request_set $verified_uid $upstream_http_x_verified_uid;

    # auth_request answers a failed verification with nginx's own HTML page and
    # drops the service's JSON. The client routes on the `auth:` prefix of
    # `detail` — it is how a user whose session expired is not told to go and
    # fix their API key — so the JSON is put back here.
    #
    # Only auth_request produces these two codes in this location: responses
    # proxied from the service pass through untouched (proxy_intercept_errors
    # is off), so a provider's 401 for a missing key still reaches the client
    # as the service wrote it. auth_request turns anything from /_verify other
    # than 2xx/401/403 — the service's 503 for a missing FIREBASE_PROJECT_ID, or
    # no answer at all — into a 500, which is why 500 means "cannot verify".
    error_page 401 = @unauthenticated;
    error_page 500 = @verifier_unavailable;
    # Repeated from server scope: a location that declares any error_page
    # inherits none, and the per-address limit above would answer in HTML.
    error_page 429 = @ratelimited;

    proxy_pass http://ratelimiter;

    # The body streams straight through to the loopback hop rather than being
    # spooled here and again there. The size cap above still applies.
    proxy_request_buffering off;

    # The upstream keepalive pool is only used over HTTP/1.1 with the client's
    # Connection header cleared; without both of these nginx opens a fresh
    # connection on every request and the pool sits empty.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Set from the verification, never from the client: a client-supplied
    # X-Verified-Uid is overwritten here.
    proxy_set_header X-Verified-Uid $verified_uid;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The upstream allows itself 60s per provider call; the client waits 75s.
    # Anything shorter here would cut off a request that is still being served.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

# The auth_request target. Carries the caller's headers — Authorization and
# X-User-Id — and nothing else: no body, and a GET whatever the original was.
location = /_verify {
    internal;

    proxy_pass http://microservice/internal/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Verification is a signature check against cached keys: milliseconds. A
    # verifier that has not answered in 10s is not going to, and the caller is
    # better served by a prompt 503 than by the full 90s.
    proxy_read_timeout 10s;
}

location @unauthenticated {
    return 401 '{"detail":"auth: invalid token"}';
}

location @verifier_unavailable {
    return 503 '{"detail":"auth: verifier unavailable"}';
}

# JSON body for rate-limit rejections, from either limit.
error_page 429 = @ratelimited;
location @ratelimited {
    return 429 '{"error":"rate limit exceeded"}';
}
