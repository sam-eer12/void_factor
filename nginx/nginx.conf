# Development config: plain HTTP on :80, published as :8080 by docker-compose.yml.
# Production is deploy/nginx.prod.conf, which adds TLS and shares the location
# rules below through the same include.

worker_processes auto;

# A proxied request holds two connections, one to the client and one to the
# replica, so worker_processes x worker_connections is twice the in-flight
# ceiling rather than equal to it. At 1024 on a four-core host that ceiling was
# about 2,000, and a load test driven past it did not slow down — it collapsed,
# logging "1024 worker_connections are not enough" 37,500 times in one run while
# throughput fell. 4096 puts the proxy's ceiling above the service's own, which
# is where it belongs: the thing that runs out first should be the thing doing
# the work. Raising it further would only move the failure downstream, since the
# service itself breaks up around 6,000 requests in flight.
#
# worker_connections is capped by the per-worker file descriptor limit, so that
# is raised to match; without it nginx accepts the setting and then fails on
# accept() instead.
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    # ~10 requests/minute per user, keyed on the Firebase UID header.
    limit_req_zone $http_x_user_id zone=peruser:10m rate=10r/m;
    limit_req_status 429;

    upstream microservice {
        server microservice:8000;

        # Present in development too, though there is only one replica here.
        # Not for the throughput: it is so a load test run against this stack
        # measures the same connection behaviour production has, rather than
        # charging every request a TCP handshake production never pays.
        keepalive 32;
    }

    server {
        listen 80;
        default_type application/json;

        include /etc/nginx/api_locations.conf;
    }
}
